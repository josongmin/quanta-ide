name: Security

on:
  push:
    branches: [main, master]
    paths:
      - "desktop/**"
      - "p0-ide-v2/**"
      - ".github/workflows/security.yml"
      - ".semgrepignore"
      - ".semgrep/**"
      - ".gitleaks.toml"
  pull_request:
    paths:
      - "desktop/**"
      - "p0-ide-v2/**"
      - ".github/workflows/**"
      - ".semgrepignore"
      - ".semgrep/**"
      - ".gitleaks.toml"
  workflow_dispatch:
  schedule:
    - cron: "27 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: rhysd/actionlint@v1.7.7

  semgrep-community:
    name: Semgrep (community rules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan (community rules, ERROR+)
        run: >-
          semgrep scan --metrics=off
          --config p/ci
          --config p/typescript
          --config p/react
          --severity ERROR
          --error .

  semgrep-custom:
    name: Semgrep (architecture rules)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan (hexagonal + FSD + quality rules)
        run: >-
          semgrep scan --metrics=off
          --config .semgrep/
          --error .

  rust-lint:
    name: Rust lint (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -euxo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp
          sudo install -m755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Detect secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: p0-ide-v2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: p0-ide-v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit (high+)
        run: pnpm audit --audit-level=high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
