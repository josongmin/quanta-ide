version: 2
updates:
  - package-ecosystem: npm
    directory: "/p0-ide"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 15
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
          - "typescript-eslint"
      vitest:
        patterns:
          - "@vitest/*"
          - "vitest"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
