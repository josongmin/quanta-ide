[project]
name = "payments-api"
version = "0.9.0"
description = "Demo corpus for quanta-ide — intentionally contains analysis-worthy patterns"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "asyncio",
    "aiohttp",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.ruff]
target-version = "py311"
line-length = 100
