rules:
  # ════════════════════════════════════════════════════════════════════
  # TYPESCRIPT / REACT — prevent sloppy frontend patterns (p0-ide-v2)
  # ════════════════════════════════════════════════════════════════════

  - id: no-any-type
    pattern: "(x: any)"
    paths:
      include:
        - "/p0-ide-v2/packages/"
        - "/p0-ide-v2/src/"
      exclude:
        - "**/*.test.*"
        - "**/__tests__/**"
        - "**/*.stories.*"
    message: >
      Do not use `any` — use `unknown`, a proper type, or a generic.
    languages: [typescript]
    severity: WARNING

  - id: no-ts-ignore
    pattern-regex: "@ts-ignore"
    paths:
      include:
        - "/p0-ide-v2/packages/"
        - "/p0-ide-v2/src/"
      exclude:
        - "**/*.test.*"
        - "**/__tests__/**"
    message: >
      Do not use @ts-ignore. Use @ts-expect-error with an explanation if truly needed.
    languages: [typescript]
    severity: ERROR

  - id: no-console-log
    pattern: "console.log(...)"
    paths:
      include:
        - "/p0-ide-v2/packages/"
        - "/p0-ide-v2/src/"
      exclude:
        - "**/*.test.*"
        - "**/__tests__/**"
        - "**/*.stories.*"
    message: >
      Remove console.log. Use a proper logging utility or remove before commit.
    languages: [typescript]
    severity: WARNING

  - id: no-tauri-api-in-platform-agnostic-packages
    pattern-regex: "from\\s+['\"]@tauri-apps/api"
    paths:
      include:
        - "/p0-ide-v2/packages/domain-types/"
        - "/p0-ide-v2/packages/ui-kit/"
    message: >
      Tauri API imports must not appear in domain-types or ui-kit.
      Keep these packages platform-agnostic; call Tauri from app or shell layers.
    languages: [typescript]
    severity: ERROR
