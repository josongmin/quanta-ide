rules:
  # ════════════════════════════════════════════════════════════════════
  # TYPESCRIPT / REACT — prevent sloppy frontend patterns
  # ════════════════════════════════════════════════════════════════════

  - id: no-any-type
    pattern: "(x: any)"
    paths:
      include:
        - "/p0-ide/src/"
      exclude:
        - "/p0-ide/src/test/"
        - "**/*.test.*"
    message: >
      Do not use `any` — use `unknown`, a proper type, or a generic.
    languages: [typescript]
    severity: WARNING

  - id: no-ts-ignore
    pattern-regex: "@ts-ignore"
    paths:
      include:
        - "/p0-ide/src/"
    message: >
      Do not use @ts-ignore. Use @ts-expect-error with an explanation if truly needed.
    languages: [typescript]
    severity: ERROR

  - id: no-console-log
    pattern: "console.log(...)"
    paths:
      include:
        - "/p0-ide/src/"
      exclude:
        - "/p0-ide/src/test/"
        - "**/*.test.*"
    message: >
      Remove console.log. Use a proper logging utility or remove before commit.
    languages: [typescript]
    severity: WARNING

  - id: no-tauri-api-in-shared
    pattern-regex: "from\\s+['\"]@tauri-apps/api"
    paths:
      include:
        - "/p0-ide/src/shared/"
        - "/p0-ide/src/entities/"
    message: >
      Tauri API imports must not appear in shared/ or entities/ layers.
      These FSD layers must remain platform-agnostic. Use features/ or widgets/ instead.
    languages: [typescript]
    severity: ERROR

  - id: fsd-no-upward-import-shared
    pattern-regex: "from\\s+['\"]@/(features|widgets|app)/"
    paths:
      include:
        - "/p0-ide/src/shared/"
    message: >
      FSD VIOLATION: shared/ must not import from features/, widgets/, or app/.
      Shared is the bottom layer — dependencies point downward only.
    languages: [typescript]
    severity: ERROR

  - id: fsd-no-upward-import-entities
    pattern-regex: "from\\s+['\"]@/(features|widgets|app)/"
    paths:
      include:
        - "/p0-ide/src/entities/"
    message: >
      FSD VIOLATION: entities/ must not import from features/, widgets/, or app/.
    languages: [typescript]
    severity: ERROR

  - id: fsd-no-upward-import-features
    pattern-regex: "from\\s+['\"]@/(widgets|app)/"
    paths:
      include:
        - "/p0-ide/src/features/"
    message: >
      FSD VIOLATION: features/ must not import from widgets/ or app/.
    languages: [typescript]
    severity: ERROR
